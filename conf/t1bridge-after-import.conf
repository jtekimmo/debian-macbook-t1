# Drop-in for t1-touchid-auth.service. The import of Apple's machine data (t1bridge-import.service, a read-only oneshot
# reading the ESP, under a second) runs when the Touch ID broker starts and finishes before it, hence before the first
# fingerprint enrolment. Wants= and not Requires=: if the import fails, the broker still starts. The import unit is static
# (no WantedBy): without Wants=, After= would do nothing because nobody starts it.
[Unit]
Wants=t1bridge-import.service
After=t1bridge-import.service
